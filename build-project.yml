# Uses the following actions:
# https://github.com/aws-actions/configure-aws-credentials
# https://github.com/aws-actions/aws-cloudformation-github-deploy

name: Build Project
on:
  release:
    types: [published]
env:
  PROJECT_NAME: "LyraStarterProject" # Update with project name
  UNREAL_ENGINE_VERSION: "5.6" # Update with Unreal Engine version
  AMI_ID: "ami-1234567890" # Update with AMI ID for Unreal Engine version
  BUCKET_NAME: "lyra-starter-project-builds"
  INSTANCE_TYPE: "z1d.2xlarge" # Set instance type to match AMI
  IAM_ROLE: "arn:aws:iam::123456789:role/BuildRole" # Update with IAM role for build
  IAM_FLEET_ROLE: "arn:aws:iam::123456789:role/aws-service-role/spotfleet.amazonaws.com/AWSServiceRoleForEC2SpotFleet" # Update with IAM role for fleet
permissions:
  id-token: write
  contents: read
jobs:
  StartEC2Instance:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          role-session-name: ${{ env.PROJECT_NAME }}Build-${{ github.sha }}
          aws-region: ap-southeast-2
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          lfs: false
      - name: Deploy CloudFormation Stack
        uses: aws-actions/aws-cloudformation-github-deploy@v2
        with:
          name: ${{ env.PROJECT_NAME }}BuildStack-${{ github.sha }}
          template: ${{ github.workspace }}/infra-build.yml
          parameter-overrides: "AmiId=${{ env.AMI_ID }},InstanceType=${{ env.INSTANCE_TYPE }},IamFleetRole=${{ env.IAM_FLEET_ROLE }}"

  BuildProject:
    runs-on: [self-hosted, unreal-engine-56]
    timeout-minutes: 120
    needs: StartEC2Instance
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          lfs: true
      - name: Build project
        shell: powershell
        run: |
          # Build the project using Unreal Engine's command line tools
          & "C:\Program Files\Epic Games\UE_${{ env.UNREAL_ENGINE_VERSION }}\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun -project="${{ github.workspace }}\${{ env.PROJECT_NAME }}.uproject" -noP4 -platform=Win64 -clientconfig=Shipping -serverconfig=Shipping -cook -allmaps -build -stage -pak -archive -archivedirectory="${{ github.workspace }}\Output"
      - name: Zip files for upload
        shell: powershell
        run: |
          Compress-Archive -Path ${{ github.workspace }}\Output\Windows\* -DestinationPath ${{ github.workspace }}\${{ env.PROJECT_NAME }}-${{ github.ref_name }}.zip
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          role-session-name: ${{ env.PROJECT_NAME }}Build-${{ github.sha }}
          aws-region: ap-southeast-2
      - name: Copy files to S3 bucket
        shell: powershell
        run: |
          aws s3 cp ${{ github.workspace }}/${{ env.PROJECT_NAME }}-${{ github.ref_name }}.zip s3://${{ env.BUCKET_NAME }}/${{ env.PROJECT_NAME }}-${{ github.ref_name }}.zip

  StopEC2Instance:
    runs-on: ubuntu-latest
    needs: BuildProject
    if: always()
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.IAM_ROLE }}
          role-session-name: ${{ env.PROJECT_NAME }}Build-${{ github.sha }}
          aws-region: ap-southeast-2
      - name: Delete CloudFormation Stack
        run: |
          aws cloudformation delete-stack --stack-name ${{ env.PROJECT_NAME }}BuildStack-${{ github.sha }}